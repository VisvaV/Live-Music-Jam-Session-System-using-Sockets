<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Music Jam Session</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 bg-opacity-70 backdrop-filter backdrop-blur-lg rounded-xl shadow-2xl overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">Live Music Jam</h1>
                <p class="text-gray-300">Create or join a music session with friends</p>
            </div>
            
            <div class="flex mb-6">
                <button id="createTabBtn" class="flex-1 py-3 text-white font-medium rounded-tl-lg bg-indigo-600 hover:bg-indigo-700 transition duration-300 focus:outline-none">Create Room</button>
                <button id="joinTabBtn" class="flex-1 py-3 text-white font-medium rounded-tr-lg bg-gray-700 hover:bg-gray-600 transition duration-300 focus:outline-none">Join Room</button>
            </div>
            
            <!-- Create Room Form -->
            <div id="createRoomForm" class="transition-all duration-300">
                <form id="createForm" class="space-y-4">
                    <div>
                        <label for="createUsername" class="block text-gray-300 mb-2">Your Name</label>
                        <input type="text" id="createUsername" class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your name" required>
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Create Room
                    </button>
                </form>
            </div>
            
            <!-- Join Room Form -->
            <div id="joinRoomForm" class="hidden transition-all duration-300">
                <form id="joinForm" class="space-y-4">
                    <div>
                        <label for="joinUsername" class="block text-gray-300 mb-2">Your Name</label>
                        <input type="text" id="joinUsername" class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter your name" required>
                    </div>
                    <div>
                        <label for="roomId" class="block text-gray-300 mb-2">Room ID</label>
                        <input type="text" id="roomId" class="w-full px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Enter room ID" required>
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Join Room
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-gray-800 p-6 rounded-lg shadow-xl text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mx-auto mb-4"></div>
                <p class="text-white text-lg">Processing...</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
